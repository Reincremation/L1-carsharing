<!DOCTYPE html>
<html lang="ru">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Бронирование — DriveNow
  </title>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body class="page">
  <header class="site-header">
   <h1 class="site-header__title">
    Бронирование автомобиля
   </h1>
   <p class="site-header__subtitle">
    Заполните форму, чтобы запланировать поездку.
   </p>
  </header>
  <nav aria-label="Основная навигация" class="nav">
   <ul class="nav__list">
    <li class="nav__item">
     <a class="nav__link" href="index.html">
      Главная
     </a>
    </li>
    <li class="nav__item">
     <a class="nav__link" href="catalog.html">
      Автомобили
     </a>
    </li>
    <li class="nav__item">
     <a class="nav__link" href="detail.html">
      Об автомобиле
     </a>
    </li>
    <li class="nav__item">
     <a class="nav__link" href="collection.html">
      История поездок
     </a>
    </li>
    <li class="nav__item">
     <a aria-current="page" class="nav__link nav__link_active" href="checkout.html">
      Бронирование
     </a>
    </li>
   </ul>
  </nav>
  <main class="page__content content">
   <form action="#" class="booking-form" method="post">
    <fieldset class="booking-form__fieldset">
     <legend class="booking-form__legend">
      Данные бронирования
     </legend>
     <p class="booking-form__group">
      <label class="booking-form__label" for="car">
       Автомобиль:
      </label>
      <select class="booking-form__input" id="car" name="car" required="">
       <option value="">
        Выберите автомобиль
       </option>
       <option value="solaris">
        Hyundai Solaris
       </option>
       <option value="rio">
        Kia Rio
       </option>
       <option value="polo">
        Volkswagen Polo
       </option>
      </select>
     </p>
     <p class="booking-form__group">
      <label class="booking-form__label" for="start">
       Дата и время начала аренды:
      </label>
      <input class="booking-form__input" id="start" name="start" required="" type="datetime-local"/>
     </p>
     <fieldset class="booking-form__fieldset">
      <legend class="booking-form__legend">
       Тип страховки
      </legend>
      <p class="booking-form__group">
       <input class="booking-form__choice" id="insurance-basic" name="insurance" required="" type="radio" value="basic"/>
       <label class="booking-form__label" for="insurance-basic">
        Базовая
       </label>
       <input class="booking-form__choice" id="insurance-extended" name="insurance" type="radio" value="extended"/>
       <label class="booking-form__label" for="insurance-extended">
        Расширенная
       </label>
       <input class="booking-form__choice" id="insurance-full" name="insurance" type="radio" value="full"/>
       <label class="booking-form__label" for="insurance-full">
        Полная
       </label>
      </p>
     </fieldset>
     <p class="booking-form__group">
      <input class="booking-form__choice" id="child-seat" name="child_seat" type="checkbox" value="yes"/>
      <label class="booking-form__label" for="child-seat">
       Требуется детское кресло
      </label>
     </p>
     <p class="booking-form__group">
      <label class="booking-form__label" for="name">
       ФИО:
      </label>
      <input class="booking-form__input" id="name" maxlength="100" minlength="2" name="name" required="" type="text"/>
     </p>
     <p class="booking-form__group">
      <label class="booking-form__label" for="phone">
       Контактный телефон:
      </label>
      <input class="booking-form__input" id="phone" name="phone" pattern="[+0-9() \-]{7,20}" required="" type="tel"/>
     </p>
     <p class="booking-form__group">
      <label class="booking-form__label" for="email">
       Электронная почта:
      </label>
      <input class="booking-form__input" id="email" name="email" required="" type="email"/>
     </p>
     <p class="booking-form__group">
      <label class="booking-form__label" for="comment">
       Комментарий:
      </label>
      <textarea class="booking-form__input" id="comment" maxlength="500" name="comment" rows="4"></textarea>
     </p>
     <p class="booking-form__group">
      <button class="button button_primary" type="submit">
       Отправить заявку
      </button>
     </p>
    </fieldset>
   </form>
  </main>
  <footer class="footer">
   <p class="footer__copy">
    © 2026 DriveNow.
   </p>
   <address class="footer__address">
    Почта:
    <a class="footer__link" href="mailto:azvalv1@mail.ru">
     azvalv1@mail.ru
    </a>
   </address>
  </footer>
 </body>
</html>
